name: Build QuestHabits Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Extract ZIP if present
        run: |
          ZIP=$(find . -name "*.zip" -not -path "*/.git/*" | head -1)
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -d extracted/
            PKG=$(find extracted/ -name "package.json" -not -path "*/node_modules/*" | head -1)
            DIR=$(dirname "$PKG")
            cp -r "$DIR"/. .
          fi

      - name: Fix launcher icons
        run: |
          sudo apt-get install -y imagemagick
          for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            dir="android/app/src/main/res/$folder"
            mkdir -p "$dir"
            size=48
            [ "$folder" = "mipmap-hdpi" ] && size=72
            [ "$folder" = "mipmap-xhdpi" ] && size=96
            [ "$folder" = "mipmap-xxhdpi" ] && size=144
            [ "$folder" = "mipmap-xxxhdpi" ] && size=192
            convert -size ${size}x${size} xc:#6366F1 "$dir/ic_launcher.png"
            convert -size ${size}x${size} xc:#6366F1 "$dir/ic_launcher_round.png"
          done

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Write Keystore from Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/android/app/release.keystore
          echo "Keystore at: $GITHUB_WORKSPACE/android/app/release.keystore"
          ls -la $GITHUB_WORKSPACE/android/app/release.keystore

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestHabits-v1.0.0-RELEASE
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
