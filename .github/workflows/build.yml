name: Build QuestHabits Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.3'

      - name: Extract ZIP if present
        run: |
          ZIP=$(find . -name "*.zip" -not -path "*/.git/*" | head -1)
          if [ -n "$ZIP" ]; then
            echo "ZIP found: $ZIP"
            unzip -o "$ZIP" -d extracted/
            PKG=$(find extracted/ -name "package.json" -not -path "*/node_modules/*" | head -1)
            DIR=$(dirname "$PKG")
            echo "Copying from: $DIR"
            cp -r "$DIR"/. .
          fi
          ls -la
          ls android/app/

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestHabits-v1.0.0-RELEASE
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
