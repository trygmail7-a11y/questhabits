name: Build QuestHabits Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Extract ZIP and merge files
        run: |
          ZIP=$(find . -name "*.zip" -not -path "*/.git/*" | head -1)
          if [ -n "$ZIP" ]; then
            echo "ZIP found: $ZIP"
            unzip -o "$ZIP" -d extracted/
            echo "Extracted contents:"
            ls -la extracted/
            if [ -d "extracted/android" ]; then
              cp -r extracted/android/. android/ 2>/dev/null || true
              echo "Android folder merged"
            fi
            find extracted/ -maxdepth 1 -type f | while read f; do
              cp "$f" . 2>/dev/null || true
            done
          fi
          echo "Android dir:"
          ls -la android/ 2>/dev/null || echo "No android dir"
          echo "Assets:"
          ls -la android/app/src/main/assets/ 2>/dev/null || echo "No assets"

      - name: Fix launcher icons
        run: |
          sudo apt-get install -y imagemagick -q
          for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            dir="android/app/src/main/res/$folder"
            mkdir -p "$dir"
            size=48
            [ "$folder" = "mipmap-hdpi" ] && size=72
            [ "$folder" = "mipmap-xhdpi" ] && size=96
            [ "$folder" = "mipmap-xxhdpi" ] && size=144
            [ "$folder" = "mipmap-xxxhdpi" ] && size=192
            convert -size ${size}x${size} xc:#6366F1 "$dir/ic_launcher.png" 2>/dev/null || true
            convert -size ${size}x${size} xc:#6366F1 "$dir/ic_launcher_round.png" 2>/dev/null || true
          done

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Write Keystore from Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestHabits-v1.0.0-RELEASE
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
