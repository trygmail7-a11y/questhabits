name: Build QuestHabits APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.3'

      - name: Extract ZIP if present
        run: |
          ZIP=$(find . -name "*.zip" -not -path "*/.git/*" | head -1)
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -d extracted/
            PKG=$(find extracted/ -name "package.json" -not -path "*/node_modules/*" | head -1)
            DIR=$(dirname "$PKG")
            cp -r "$DIR"/. .
          fi
          ls -la

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate debug keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Keystore created"
          else
            echo "Keystore already exists, skipping"
          fi

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestHabits-v1.0.0
          path: android/app/build/outputs/apk/release/app-release*.apk
          retention-days: 30
